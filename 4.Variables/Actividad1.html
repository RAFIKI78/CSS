<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Documento con hipervínculos</title>
  <style>
    :root {
      /* Variable de color */
      --color-principal: #1e90ff;
    }

    h1 {
      color: var(--color-principal);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: var(--color-principal);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    p {
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Mi documento con enlaces</h1>

  <p>
    Este es un párrafo con algunos hipervínculos, por ejemplo a 
    <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>,
    a <a href="https://github.com/RAFIKI78/" target="_blank">GitHub</a>
    y a <a href="https://www.mozilla.org" target="_blank">Mozilla</a>.
  </p>
</body>
</html>
